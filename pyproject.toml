[project]
name = "engram"
version = "0.1.0"
description = "Long-term memory for conversational agents: a LangGraph agent that decides what to remember, dedupes, resolves contradicting facts, decays stale memory, and refuses to let untrusted text write to user memory."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "langchain-core>=1.0,<2",
    "langchain-aws>=1.7,<2",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Local semantic embeddings (ONNX, no torch). Optional so CI stays tiny and
# offline: the deterministic `hashing` embedder is the default everywhere.
embed = [
    "fastembed>=0.8,<0.9",
]
# The managed-memory baseline the benchmark compares against. Optional because
# mem0 needs a real LLM on every write, so this arm can never join CI, and
# because it pulls openai/qdrant/sqlalchemy that the product itself never uses.
baseline = [
    "mem0ai>=2,<3",
    # mem0's own aws_bedrock adapter is broken for Amazon models (it sends a
    # bare string where Converse wants content blocks), so we route it through
    # its langchain provider — which also hands it the exact model object we
    # use. That provider imports the langchain umbrella package.
    "langchain>=1,<2",
]
# Vendor-neutral tracing. Optional because the default is off, and because the
# structured logs and per-turn trace already carry the memory-op story.
otel = [
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]
dev = [
    # Tracing is optional at runtime but its tests are not optional to run, and
    # CI installs exactly this extra. Leaving it out meant a fresh clone — and
    # therefore CI — failed on collection.
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3-stubs[bedrock-runtime]>=1.34",
]
infra = [
    "aws-cdk-lib>=2.140",
    "constructs>=10.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "llm: requires working AWS Bedrock credentials (skipped in CI)",
    "postgres: requires a running Postgres+pgvector (skipped unless ENGRAM_TEST_DSN is set)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["engram"]
ignore_missing_imports = true
